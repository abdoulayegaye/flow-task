<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold mb-0">
            @if (isEditMode) {
            <i class="fa-solid fa-pen-to-square me-2 text-secondary"></i>Modifier la tâche
            } @else {
            <i class="fa-solid fa-plus-circle me-2 text-primary"></i>Nouvelle tâche
            }
        </h1>
        <a class="btn btn-outline-secondary" routerLink="/tasks">
            <i class="fa-solid fa-arrow-left me-1"></i>Annuler
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form [formGroup]="form" (ngSubmit)="submit()">
                <div class="mb-3">
                    <label for="title" class="form-label fw-medium">
                        <i class="fa-solid fa-heading me-1 text-muted"></i>Titre <span class="text-danger">*</span>
                    </label>
                    <input id="title" type="text" class="form-control" formControlName="title"
                        placeholder="Titre de la tâche" />
                    @if (form.controls.title.invalid && form.controls.title.touched) {
                        <div class="text-danger small mt-1">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>Le titre est requis.
                        </div>
                    }
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-medium">
                        <i class="fa-solid fa-align-left me-1 text-muted"></i>Description
                    </label>
                    <textarea id="description" class="form-control" formControlName="description" rows="3"
                        placeholder="Description optionnelle..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">
                        <i class="fa-solid fa-flag me-1 text-muted"></i>Priorité
                    </label>
                    <div class="btn-group w-100" role="group" aria-label="Priorité">
                        <button 
                            type="button" 
                            class="btn btn-outline-secondary"
                            (click)="form.controls.priority.setValue('low')"
                            [class.active]="form.controls.priority.value === 'low'">
                            <i class="fa-solid fa-flag me-1"></i>Faible
                        </button>
                        <button 
                            type="button" 
                            class="btn btn-outline-warning" 
                            (click)="form.controls.priority.setValue('medium')" 
                            [class.active]="form.controls.priority.value === 'medium'">
                            <i class="fa-solid fa-flag me-1"></i>Moyen
                        </button>
                        <button 
                            type="button" 
                            class="btn btn-outline-danger" 
                            (click)="form.controls.priority.setValue('high')" 
                            [class.active]="form.controls.priority.value === 'high'">
                            <i class="fa-solid fa-flag me-1"></i>Élevé
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="status" class="form-label fw-medium">
                        <i class="fa-solid fa-circle-half-stroke me-1 text-muted"></i>Statut
                    </label>
                    <select id="status" class="form-select" formControlName="status">
                        <option value="todo">À faire</option>
                        <option value="in-progress">En cours</option>
                        <option value="done">Terminé</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit" [disabled]="form.invalid  || saving">
                        @if (isEditMode) {
                        <i class="fa-solid fa-floppy-disk me-2"></i>Enregistrer les modifications
                        } @else {
                        <i class="fa-solid fa-plus me-2"></i>Créer la tâche
                        }
                    </button>
                </div>
            </form>
        </div>


    </div>
</div>
